# minikube on Windows: ingress-nginx is reached through `kubectl port-forward ... 8088:80`,
# so the public URL carries :8088 (SYSTEM.md L5). nip.io resolves *.127.0.0.1.nip.io to 127.0.0.1.
publicUrl: "http://store.127.0.0.1.nip.io:8088"

ingress:
  className: nginx
  host: store.127.0.0.1.nip.io

site:
  title: "Urumi Demo Store"
  adminEmail: admin@store.127.0.0.1.nip.io

wooMcp:
  # Built inside minikube by ops/up.ps1 (`minikube image build`), never pulled.
  image: store-platform/woo-mcp:dev
  pullPolicy: Never

networkPolicy:
  ingressControllerNamespace: ingress-nginx

# The default store is backed up nightly (charts/backups must be installed; ops/up.ps1 does both).
backup:
  enabled: true
