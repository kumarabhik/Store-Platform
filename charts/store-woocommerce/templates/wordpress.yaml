apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "store.fullname" . }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    # Store content (uploads, plugins) must survive `helm uninstall` / reinstall.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.wordpress.persistence.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "store.fullname" . }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store.fullname" . }}-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  replicas: 1
  # ReadWriteOnce volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "store.podSecurityContext" . | nindent 8 }}
        # Lets Apache bind :80 without root. Namespaced and "safe" since Kubernetes 1.22.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      {{- if .Values.wordpress.volumePermissions.enabled }}
      # hostPath-backed provisioners (minikube, k3s local-path) ignore fsGroup, so the volume root
      # stays root-owned and the image's first-start copy fails as uid 33 (SYSTEM.md L17).
      # Only the mount root is chowned, only if needed, with CHOWN as the sole capability.
      initContainers:
        - name: volume-permissions
          image: {{ .Values.images.wordpress }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["sh", "-c", "[ \"$(stat -c %u /var/www/html)\" = 33 ] || chown 33:33 /var/www/html"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      {{- end }}
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "store.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{- include "store.wordpressDbEnv" . | nindent 12 }}
          # /wp-login.php answers 200 (or 302 before install) without touching the storefront theme.
          startupProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: {{ include "store.fullname" . }}-wordpress
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "store.fullname" . }}-storefront
  labels:
    {{- include "store.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "store.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "store.fullname" . }}-wordpress
                port:
                  name: http
{{- end }}
