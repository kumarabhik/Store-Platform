{{- if not .Values.existingSecret }}
{{- $ck := printf "ck_%s" (randAlphaNum 40 | lower) }}
{{- $cs := printf "cs_%s" (randAlphaNum 40 | lower) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.secretName" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`: the MariaDB volume is retained too, and it only accepts these passwords.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ include "store.persistentSecret" (dict "ctx" . "key" "mariadb-root-password" "default" (randAlphaNum 24)) | b64enc | quote }}
  mariadb-password: {{ include "store.persistentSecret" (dict "ctx" . "key" "mariadb-password" "default" (randAlphaNum 24)) | b64enc | quote }}
  wordpress-admin-password: {{ include "store.persistentSecret" (dict "ctx" . "key" "wordpress-admin-password" "default" (randAlphaNum 20)) | b64enc | quote }}
  # WooCommerce REST API key used only by this store's MCP server (inserted by the init job).
  woo-consumer-key: {{ include "store.persistentSecret" (dict "ctx" . "key" "woo-consumer-key" "default" $ck) | b64enc | quote }}
  woo-consumer-secret: {{ include "store.persistentSecret" (dict "ctx" . "key" "woo-consumer-secret" "default" $cs) | b64enc | quote }}
  # Bearer token the gateway presents to this store's MCP server (P2).
  mcp-token: {{ include "store.persistentSecret" (dict "ctx" . "key" "mcp-token" "default" (randAlphaNum 40)) | b64enc | quote }}
{{- end }}
