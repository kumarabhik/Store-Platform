apiVersion: v1
kind: Service
metadata:
  name: {{ include "store.dbHost" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "store.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "store.dbHost" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: {{ include "store.dbHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "store.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # "mysql" in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "store.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.secretName" . }}
                  key: mariadb-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.secretName" . }}
                  key: mariadb-root-password
          # First boot initializes the data dir and can take minutes on slow disks. The startup probe
          # holds off liveness until then instead of a long initialDelaySeconds (SYSTEM.md L3).
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size | quote }}
