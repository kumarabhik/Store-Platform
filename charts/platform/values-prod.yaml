global:
  baseDomain: "your-vps-domain.com"
  # Traefik is built into k3s; ingress-nginx is end-of-life (SYSTEM.md G6). Same as the store chart.
  ingressClassName: "traefik"
  tls:
    enabled: true
    # Let's Encrypt, one certificate per host (HTTP-01, DESIGN §13.4); charts/cert-manager.
    clusterIssuer: "platform-tls"

networkPolicy:
  # Traefik is built into k3s and runs in kube-system.
  ingressControllerNamespace: kube-system

gateway:
  encKey:
    # Create before installing, and back it up: losing it makes stored upstream credentials unreadable.
    #   kubectl -n platform create secret generic gateway-enc-key --from-literal=key=$(openssl rand -base64 32)
    existingSecret: "gateway-enc-key"

api:
  # Create before installing (never put credentials in this file):
  #   kubectl -n platform create secret generic platform-api-env \
  #     --from-literal=GROQ_API_KEY=... --from-literal=ADMIN_API_KEY=...
  envSecretName: "platform-api-env"
  env:
    BASE_DOMAIN: "your-vps-domain.com"
    INGRESS_CLASS_NAME: "traefik"
    STORE_CHART_IMAGE: "ghcr.io/kumarabhik/store-chart:0.1.0"
    STORE_CHART_ENV: "prod"
    TRUST_PROXY: "true"
    DASHBOARD_PUBLIC_URL: "https://dashboard.your-vps-domain.com"
    GATEWAY_PUBLIC_URL: "https://api.your-vps-domain.com/mcp"
    CORS_ORIGINS: "https://dashboard.your-vps-domain.com"
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_CAPACITY: "120"
    RATE_LIMIT_REFILL_PER_SEC: "2"
    RATE_LIMIT_TTL_SEC: "300"
    RATE_LIMIT_MAX_KEYS: "50000"
    CREATE_RATE_LIMIT_CAPACITY: "8"
    CREATE_RATE_LIMIT_REFILL_PER_SEC: "0.1"
    CREATE_RATE_LIMIT_TTL_SEC: "900"
  image: "ghcr.io/kumarabhik/store-platform-api:0.1.0"
  # Stateless with Postgres: two replicas, rolling updates, a PodDisruptionBudget (DESIGN §13.3).
  replicas: 2
  # No SQLite volume on a fresh production install: Postgres holds everything, and without a
  # ReadWriteOnce volume the replicas can run on different nodes.
  persistence:
    enabled: false

postgres:
  enabled: true
  # Create before installing (letters and digits only; it goes into the connection URL):
  #   kubectl -n platform create secret generic platform-postgres --from-literal=password=$(openssl rand -hex 24)
  existingSecret: "platform-postgres"
  storage:
    size: 10Gi
    storageClassName: "local-path"

dashboard:
  image: "ghcr.io/kumarabhik/store-platform-dashboard:0.1.0"

# Nightly pg_dump of the platform database (users, keys, servers, audit) to the backup store.
# deploy.sh installs charts/backups and copies the upload Secret (backup-s3) into this namespace.
backup:
  enabled: true
