apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.apiName" . }}
  # Prometheus finds this Service by label (charts/monitoring ServiceMonitor).
  labels:
    app: {{ include "platform.apiName" . }}
spec:
  selector:
    app: {{ include "platform.apiName" . }}
  ports:
    - name: http
      port: 80
      targetPort: 8000
    # Prometheus metrics; no Ingress routes this port (S8).
    - name: metrics
      port: 9464
      targetPort: metrics
