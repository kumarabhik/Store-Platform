apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.apiName" . }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "platform.apiName" . }}
  template:
    metadata:
      labels:
        app: {{ include "platform.apiName" . }}
      annotations:
        # Changes when the env Secret's content changes, so the pod restarts and picks it up.
        checksum/env-secret: {{ .Values.api.envChecksum | default "" | quote }}
    spec:
      serviceAccountName: {{ include "platform.apiName" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            # Encrypts upstream MCP credentials at rest (gateway/crypto.ts).
            - name: GATEWAY_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.gatewayEncKeySecret" . }}
                  key: key
          # Credentials (Stripe, LLM, admin API key) come only from this Secret, never from values.
          # An explicit env entry would override it, so secret keys must not appear in api.env.
          envFrom:
            - secretRef:
                name: {{ .Values.api.envSecretName | quote }}
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "platform.apiName" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}

---
{{- if .Values.api.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform.apiName" . }}-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.api.persistence.size | quote }}
  {{- if .Values.api.persistence.storageClassName }}
  storageClassName: {{ .Values.api.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
