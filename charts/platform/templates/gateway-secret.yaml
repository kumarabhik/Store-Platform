{{- if not .Values.gateway.encKey.existingSecret }}
{{- /*
AES-256 key that encrypts upstream MCP credentials at rest (DESIGN §8.3). Generated once and then
reused through lookup: a new key would make every stored credential unreadable (same rule as
SYSTEM.md I7). Kept on `helm uninstall` because the database on the PVC still needs it.
*/}}
{{- $name := include "platform.gatewayEncKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "key") }}
  key: {{ index $existing.data "key" }}
  {{- else }}
  # randBytes returns base64 already; the env var holds that base64 text, so encode once more for data.
  key: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
