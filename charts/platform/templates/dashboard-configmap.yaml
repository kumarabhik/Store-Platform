{{- if .Values.dashboard.enabled }}
# nginx server config for the dashboard. /api/ is proxied to platform-api with the prefix
# stripped (like the Vite dev proxy), so the browser talks to one origin and needs no CORS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.dashboardName" . }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location /api/ {
        proxy_pass http://{{ include "platform.apiName" . }}.{{ .Release.Namespace }}.svc.cluster.local:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The chat answers as a Server-Sent Events stream for up to 120 s (SYSTEM.md G5).
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }

      # Hashed assets can be cached forever; index.html must not be, or users keep an old build.
      location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
      }

      location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
      }
    }
{{- end }}
