{{- if .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform.dashboardName" . }}
  {{- $annotations := .Values.dashboard.ingress.annotations | default dict }}
  {{- with .Values.global.tls.clusterIssuer }}
  {{- $annotations = merge (dict "cert-manager.io/cluster-issuer" .) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName | quote }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts:
        - {{ printf "dashboard.%s" .Values.global.baseDomain | quote }}
      secretName: {{ include "platform.tlsSecret" (dict "ctx" . "name" (include "platform.dashboardName" .)) | quote }}
  {{- end }}
  rules:
    - host: {{ printf "dashboard.%s" .Values.global.baseDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform.dashboardName" . }}
                port:
                  number: 80
{{- end }}
