{{- if not .Values.existingSecret }}
{{- $name := include "backups.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if and $existing $existing.data }}{{- $old = $existing.data }}{{- end }}
# Garage's cluster secret and admin token, and the S3 key the backup jobs upload with. Generated
# once and kept (I7): a new key would orphan the existing backups' access. Garage expects the key id
# as "GK" + 24 hex characters and the secret as 64 hex characters.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "backups.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  rpc-secret: {{ index $old "rpc-secret" | default (printf "%s%s" (uuidv4 | replace "-" "") (uuidv4 | replace "-" "") | b64enc) }}
  admin-token: {{ index $old "admin-token" | default (randAlphaNum 40 | b64enc) }}
  access-key-id: {{ index $old "access-key-id" | default (printf "GK%s" (uuidv4 | replace "-" "" | trunc 24) | b64enc) }}
  secret-access-key: {{ index $old "secret-access-key" | default (printf "%s%s" (uuidv4 | replace "-" "") (uuidv4 | replace "-" "") | b64enc) }}
{{- end }}
