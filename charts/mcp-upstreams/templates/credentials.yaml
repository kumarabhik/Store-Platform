{{- if not .Values.existingSecret }}
{{- $name := include "upstreams.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Bearer token the gateway presents to notes-mcp. The gateway reads it through the Kubernetes API
# (GATEWAY_SEED_SERVERS credential_secret), so it never appears in values. Generated once, kept.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "upstreams.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "notes-mcp-token") }}
  notes-mcp-token: {{ index $existing.data "notes-mcp-token" }}
  {{- else }}
  notes-mcp-token: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
