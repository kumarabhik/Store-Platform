# CI: the same checks AGENTS.md Rule 5 asks for before anything is marked done, on every push and
# pull request. Images are built to prove every Dockerfile works, but not pushed (no registry
# credentials in CI yet; production images are tagged by hand, see values-prod.yaml).
name: CI

on:
  push:
    branches: [main, mcp-gateway]
    # A version tag (v0.1.0) also publishes the images to GHCR for the VPS (values-prod.yaml).
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci
      - run: npm run check
      # On Linux + Node 20 better-sqlite3 loads, so the SQLite suites run too (SYSTEM.md L13).
      - run: npm test

  # The same suites against Postgres (DESIGN §13.3): every query must work on both databases.
  backend-postgres:
    name: Backend (tests on Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/test

  mcp-servers:
    name: MCP servers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: mcp-servers/woo-mcp
            node: "20"
          # notes-mcp uses the built-in node:sqlite module (Node >= 22.13).
          - dir: mcp-servers/notes-mcp
            node: "22"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm (lint, render, schema-validate; local and prod)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint and render every chart with both environments' values
        run: |
          set -euo pipefail
          # monitoring wraps kube-prometheus-stack, cert-manager wraps jetstack's chart (both pinned
          # in Chart.yaml/Chart.lock).
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm dependency build charts/monitoring
          helm dependency build charts/cert-manager
          mkdir -p rendered
          for chart in platform store-woocommerce mcp-upstreams monitoring backups cert-manager; do
            for env in local prod; do
              echo "::group::$chart ($env)"
              helm lint "charts/$chart" -f "charts/$chart/values.yaml" -f "charts/$chart/values-$env.yaml"
              helm template ci "charts/$chart" -n ci -f "charts/$chart/values.yaml" -f "charts/$chart/values-$env.yaml" > "rendered/$chart-$env.yaml"
              echo "::endgroup::"
            done
          done
      # Every rendered object checked against the real Kubernetes API schema (wrong field names,
      # wrong types, unknown fields with -strict), including the Prometheus and cert-manager CRDs.
      # Skipped: only the kind CustomResourceDefinition itself (cert-manager ships its CRDs as
      # templates), which the Kubernetes schema set has no schema for; resources of those kinds,
      # like our ClusterIssuer, are still validated against the CRDs catalog.
      - name: Validate rendered manifests (kubeconform)
        run: |
          docker run --rm -v "$PWD/rendered:/m" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /m

  scripts:
    name: Shell scripts (syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Scripts run in Linux containers and on the VPS; a CRLF line ending breaks them (SYSTEM.md G10).
      - name: bash -n and no CRLF
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f"
            if grep -q $'\r' "$f"; then echo "$f has CRLF line endings"; exit 1; fi
          done

  images:
    name: Image build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: [backend, backend-postgres, mcp-servers, dashboard, helm]
    # packages: write is only used on version tags, to push to ghcr.io with the workflow's own token.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ghcr: the image name values-prod.yaml / values.yaml expect under ghcr.io/<owner>/.
          - { name: api-node, context: backend-node, ghcr: store-platform-api }
          - { name: dashboard, context: dashboard, ghcr: store-platform-dashboard }
          - { name: woo-mcp, context: mcp-servers/woo-mcp, ghcr: woo-mcp }
          - { name: notes-mcp, context: mcp-servers/notes-mcp, ghcr: notes-mcp }
          - { name: everything-mcp, context: mcp-servers/everything-mcp, ghcr: everything-mcp }
          - { name: store-chart, context: charts/store-woocommerce, ghcr: store-chart }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "store-platform/${{ matrix.name }}:ci" "${{ matrix.context }}"
      - name: Publish to GHCR (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/${{ matrix.ghcr }}:${VERSION#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker tag "store-platform/${{ matrix.name }}:ci" "$image"
          docker push "$image"
          # The digest to pin in values-prod.yaml (DESIGN §13.4).
          echo "### $image" >> "$GITHUB_STEP_SUMMARY"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" >> "$GITHUB_STEP_SUMMARY"
